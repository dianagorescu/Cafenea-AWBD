<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::body}, 'Customers')}">
<body>
<div class="actions">
    <div>
        <a class="button" th:href="@{/customers/new}">New Customer</a>
    </div>
    <div class="flex items-center gap-2">
        <label class="text-sm text-gray-600">Sort:</label>
        <select onchange="location.href='?page=0&size='+${size}+'&sort='+this.value+'&dir='+${dir}" class="px-2 py-1 rounded border" th:field="*{sort}">
            <option value="name" th:selected="${sort=='name'}">Name</option>
            <option value="email" th:selected="${sort=='email'}">Email</option>
        </select>
        <label class="text-sm text-gray-600">Size:</label>
        <select onchange="location.href='?page=0&size='+this.value+'&sort='+${sort}+'&dir='+${dir}" class="px-2 py-1 rounded border">
            <option th:value="5" th:selected="${size==5}">5</option>
            <option th:value="10" th:selected="${size==10}">10</option>
            <option th:value="25" th:selected="${size==25}">25</option>
        </select>
    </div>
</div>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="customer : ${customersPage.content}">
            <td th:text="${customer.id}">1</td>
            <td th:text="${customer.name}">Name</td>
            <td th:text="${customer.email}">email@example.com</td>
            <td th:text="${customer.phone}">0123456789</td>
            <td class="actions-cell">
                <a th:href="@{/customers/{id}/edit(id=${customer.id})}" class="button small">Edit</a>
                <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" onsubmit="return confirm('Delete this customer?');">
                    <button type="submit" class="button small danger">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<div class="mt-4 flex items-center gap-2">
    <a th:if="${customersPage.hasPrevious()}" th:href="@{/customers(page=${customersPage.number-1},size=${size},sort=${sort},dir=${dir})}" class="button small">Previous</a>
    <span th:each="i : ${#numbers.sequence(0, customersPage.totalPages-1)}">
        <a th:href="@{/customers(page=${i},size=${size},sort=${sort},dir=${dir})}"
           th:classappend="${i==customersPage.number} ? ' button' : ' button secondary'"
           th:text="${i+1}">1</a>
    </span>
    <a th:if="${customersPage.hasNext()}" th:href="@{/customers(page=${customersPage.number+1},size=${size},sort=${sort},dir=${dir})}" class="button small">Next</a>
</div>
</body>
</html>
