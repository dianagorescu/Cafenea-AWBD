<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::body}, 'Menu Item Form')}">
<body>
<div class="form-card">
    <form th:action="${menuItemId} == null ? @{/menu-items} : @{/menu-items/{id}(id=${menuItemId})}"
          th:object="${menuItemRequest}" method="post" class="needs-validation" novalidate>
        <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

        <label>
            Name
            <input type="text" th:field="*{name}" placeholder="Espresso" required />
        </label>
        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label>
            Description
            <textarea th:field="*{description}" placeholder="Strong coffee"></textarea>
        </label>

        <label>
            Price
            <input type="number" step="0.01" th:field="*{price}" placeholder="3.50" min="0.01" required />
        </label>
        <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

        <label>
            Available
            <select th:field="*{available}" required>
                <option th:value="true">Yes</option>
                <option th:value="false">No</option>
            </select>
        </label>
        <div class="field-error" th:if="${#fields.hasErrors('available')}" th:errors="*{available}"></div>

        <div class="form-actions">
            <button type="submit" class="button">Save</button>
            <a class="button secondary" th:href="@{/menu-items}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
